name: CI

# Phase 3 Stage 3/5: the claims-ceiling suite runs on every push, permanently.
# A claim without a registry entry is a bug with a legal payload.
on:
  push:
    branches: [main, ui/prism-brand-transformation]
  pull_request:
    branches: [main]

# PROD-READY Phase 1 (SECURITY_REVIEW S5): least privilege for every job.
permissions:
  contents: read

jobs:
  dependency-audit:
    # Fails the build on any high/critical advisory in production
    # dependencies (root bundle and server runtime). Reads the lockfiles only;
    # dev-only tooling advisories are tracked separately (PROD_READY_STATE).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (root, production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (server, production dependencies)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    # gitleaks over the full git history with the reviewed allowlist in
    # .gitleaks.toml. The CLI is used (not gitleaks-action, which needs a
    # licence key for organisation repositories); the release archive is
    # pinned by version and SHA-256.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: gitleaks (full history)
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --redact --no-banner --exit-code 1'

  test:
    runs-on: ubuntu-latest
    services:
      # Phase 4 (§20): throwaway Postgres so the DB-gated suites — including
      # the JSON→PG migration rehearsal — actually execute in CI instead of
      # skipping. Ephemeral CI-only credentials; not a real environment.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism-ci-only
          POSTGRES_DB: prism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server tests (includes claims-ceiling + all track gates)
        working-directory: server
        run: |
          npm ci
          npm test
      - name: PG store contract + JSON→PG migration rehearsal (§20, serial)
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://prism:prism-ci-only@localhost:5432/prism_test
        run: |
          node --test --test-concurrency=1 \
            test/migration.db.test.js \
            test/storePg.db.test.js \
            test/storeMigration.db.test.js \
            test/campusMigrations.db.test.js \
            test/evidenceAudit.db.test.js \
            test/campusFoundation.db.test.js \
            test/campusRepositories.db.test.js \
            test/campusStudent.db.test.js
      - name: Client build
        run: |
          npm ci
          npm run build
      - name: Frontend unit + component tests (vitest)
        run: npm run test:unit
      - name: Restore server test dependencies after root postinstall
        working-directory: server
        run: npm ci
      - name: Corrected database and HTTP fault pipeline (disposable, controlled provider)
        run: |
          node scripts/run-experience-baseline-tests.mjs database
          node scripts/run-cr03-runtime-tests.mjs
      - name: Additive migration and compatible rollback rehearsal
        run: |
          npm run rehearse:migrations
          npm run rehearse:rollback
      - name: Static architecture safeguards
        run: npm run audit:static
      - name: Install supported critical-path browsers
        run: npx playwright install --with-deps
      - name: Critical browser and accessibility gates
        env:
          # Campus harness server (Journey B) uses the same throwaway CI database.
          PRISM_E2E_DATABASE_URL: postgres://prism:prism-ci-only@localhost:5432/prism_test
        run: npm run test:e2e:critical
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-browser-audit-evidence
          path: |
            audit-results/
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Judge fingerprint consistency (Stage 6.1)
        # The pinned judge deployment file must parse and carry the escalation
        # rule; config changes touching the deployment must update it in the
        # same commit (enforced by review + the runtime drift guard).
        run: node -e "const f=require('./server/scoring/judge-fingerprint.json'); const p=require('./server/package.json'); if(f.provider!=='aws-bedrock'||!f.modelId||!f.escalationRule||p.dependencies['@aws-sdk/client-bedrock-runtime']!==f.sdkVersion) throw new Error('judge fingerprint/SDK pin incomplete')"

  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calibration job tests (synthetic-only; no DB)
        working-directory: calibration
        run: |
          pip install numpy pytest
          python -m pytest tests -q
