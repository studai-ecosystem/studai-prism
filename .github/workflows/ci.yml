name: CI

# Phase 3 Stage 3/5: the claims-ceiling suite runs on every push, permanently.
# A claim without a registry entry is a bug with a legal payload.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Phase 4 (§20): throwaway Postgres so the DB-gated suites — including
      # the JSON→PG migration rehearsal — actually execute in CI instead of
      # skipping. Ephemeral CI-only credentials; not a real environment.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism-ci-only
          POSTGRES_DB: prism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server tests (includes claims-ceiling + all track gates)
        working-directory: server
        run: |
          npm ci
          npm test
      - name: PG store contract + JSON→PG migration rehearsal (§20, serial)
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://prism:prism-ci-only@localhost:5432/prism_test
        run: |
          node --test --test-concurrency=1 \
            test/migration.db.test.js \
            test/storePg.db.test.js \
            test/storeMigration.db.test.js
      - name: Client build
        run: |
          npm ci
          npm run build
      - name: Judge fingerprint consistency (Stage 6.1)
        # The pinned judge deployment file must parse and carry the escalation
        # rule; config changes touching the deployment must update it in the
        # same commit (enforced by review + the runtime drift guard).
        run: node -e "const f=require('./server/scoring/judge-fingerprint.json'); const p=require('./server/package.json'); if(f.provider!=='aws-bedrock'||!f.modelId||!f.escalationRule||p.dependencies['@aws-sdk/client-bedrock-runtime']!==f.sdkVersion) throw new Error('judge fingerprint/SDK pin incomplete')"

  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calibration job tests (synthetic-only; no DB)
        working-directory: calibration
        run: |
          pip install numpy pytest
          python -m pytest tests -q
