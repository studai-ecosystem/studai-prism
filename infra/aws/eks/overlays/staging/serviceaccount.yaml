# IRSA identity for staging. The role does not exist yet: the operator creates
# it (GO_LIVE_CHECKLIST.md) with
#   trust:  the cluster's OIDC provider, condition
#           sub = system:serviceaccount:prism-staging:studai-prism
#   policy: secretsmanager:GetSecretValue on /studai/prism/aws-staging/runtime*
#           ONLY, plus the same Bedrock/Polly actions as the production role
#           (docs/aws/bedrock-runtime-policy.json).
# Until the role exists the pod cannot load its runtime secret and refuses to
# start (AWS_SECRETS_MANAGER_REQUIRED=true) — it fails closed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: studai-prism
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::158346964832:role/studai-prism-staging-runtime
