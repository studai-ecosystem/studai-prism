# Production operator Jobs (namespace prism), including the HA-023 cutover Jobs.
# Usage: see the header of infra/aws/eks/jobs/ops/jobs.yaml (render, substitute
# the tag, `kubectl create -f ... -l prism.studai.one/job=<name>`; never
# `kubectl apply -k`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prism
resources:
  - ../../../jobs/ops
  - ../../../jobs/cutover
images:
  - name: prism-app
    newName: 158346964832.dkr.ecr.ap-south-1.amazonaws.com/prod/prism
    newTag: RELEASE_TAG_REQUIRED
patches:
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1
        value:
          name: AWS_SECRETS_MANAGER_SECRET_ID
          value: /studai/prism/aws-prod/runtime
