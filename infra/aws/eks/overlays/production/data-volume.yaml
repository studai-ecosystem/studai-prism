# The production EFS access point (the same one the former ECS service and
# the August EKS manifest mounted). After the PostgreSQL cutover (HA-023) it
# holds the JSON CMS file and the pre-cutover JSON store, kept untouched as the
# rollback target until a separate human decision retires it. Never delete:
# persistentVolumeReclaimPolicy Retain.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prism-data
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0ef078727a5ba4347::fsap-044dc830bda9436c5
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prism-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: prism-data
  resources:
    requests:
      storage: 5Gi
